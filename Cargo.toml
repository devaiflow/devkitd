[package]
name = "devkitd"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.5", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
async-trait = "0.1.89"
toml = "0.8"
directories = "5.0"
indexmap = { version = "2", features = ["serde"] }
