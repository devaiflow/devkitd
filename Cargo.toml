[package]
name = "devkitd"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.5", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
async-trait = "0.1.89"
toml = "0.8"
directories = "5.0"
indexmap = { version = "2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = "0.7"
nix = { version = "0.29", features = ["signal", "process"] }
rmcp = { version = "2.1.0", features = ["server", "transport-streamable-http-server", "transport-streamable-http-server-session", "macros", "schemars", "client", "transport-streamable-http-client-reqwest"] }
axum = "0.8.9"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
